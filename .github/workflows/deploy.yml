name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Assigned to env so the deploy step can be skipped (not failed) until the secret is set.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (Cloudflare target)
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is not secret (it appears in dashboard URLs); the anujpaudel98@gmail.com account.
          accountId: 7b10d7d0f4d06f76bb0e7ddbd59e2405
          command: pages deploy dist --project-name=mandy-manna --branch=main --commit-dirty=true
